<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeTalk Q3/2026</title>
<meta name="theme-color" content="#ffd6e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SafeTalk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="updBar" hidden><span data-i18n="upd_new">New version</span> <b id="updV"></b> <button id="updGo" data-i18n="upd_go">Update now</button><button id="updX" aria-label="Close">✕</button></div>
<header class="top">
  <div class="brand">
    <div>
      <h1>SafeTalk <button class="q" id="qPick"><span id="qShort">Q3/2026</span><small>▾</small></button><span class="plane">✈️</span></h1>
      <p class="sub" data-i18n="sub">Safety · First Aid · Security review</p>
      <div class="ctrls">
        <div class="lang" role="group" aria-label="Language"><button data-lang="en" class="on">EN</button><button data-lang="th">TH</button></div>
        <button id="verBtn" class="ver" aria-label="Version and update">v<span id="verTxt"></span> ⟳</button>
        <button id="streakChip" class="ver streak cold" data-mode="me">🔥 0</button>
      </div>
    </div>
    <div class="ring" id="ring" title="Progress">
      <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" class="bg"/><circle cx="18" cy="18" r="15.5" class="fg" id="ringFg"/></svg>
      <b id="ringTxt">0/0</b>
    </div>
  </div>
  <nav class="modes" role="tablist">
    <button data-mode="read" class="on" data-i18n="m_read">Read</button>
    <button data-mode="cards" data-i18n="m_cards">Cards</button>
    <button data-mode="exam" data-i18n="m_exam">Exam</button>
    <button data-mode="game" data-i18n="m_game">Games</button>
    <button data-mode="me" data-i18n="m_me">Me</button>
  </nav>
</header>

<main>
  <section id="filters">
    <div class="search"><input id="q" type="search" placeholder="Search…" data-i18n-ph="search" autocomplete="off"></div>
    <div class="chips" id="secChips"></div>
    <div class="chips fleet" id="fleetChips">
      <span class="lbl" data-i18n="fleet">✈️ Aircraft</span>
      <button data-fleet="all" class="on" data-i18n="fleet_all">All</button>
      <button data-fleet="A">🩷 Airbus</button>
      <button data-fleet="B">💙 Boeing</button>
    </div>
    <button class="pagelink" data-mode="pages" data-i18n="m_pages">📄 Original pages</button>
  </section>

  <section id="read"></section>

  <section id="cards" hidden>
    <div class="cardbar">
      <label><input type="checkbox" id="onlyTodo"> <span data-i18n="only_todo">Only not memorized</span></label>
      <button id="shuffle" class="ghost" data-i18n="shuffle">Shuffle</button>
    </div>
    <div id="card"></div>
  </section>

  <section id="game" hidden></section>

  <section id="exam" hidden></section>

  <section id="me" hidden></section>

  <section id="pages" hidden></section>
</main>

<div id="sheet" hidden>
  <div class="sheet-card">
    <h3>SafeTalk Reader</h3>
    <div class="sheet-row"><span data-i18n="sh_cur"></span><b id="shCur"></b></div>
    <div class="sheet-row"><span data-i18n="sh_new"></span><b id="shNew"></b></div>
    <div class="sheet-row"><span data-i18n="sh_offline"></span><b id="shOff"></b></div>
    <div class="sheet-notes"><b data-i18n="sh_whats"></b><ul id="shNotes"></ul></div>
    <button class="btn ok sheet-go" id="shGo" data-i18n="sh_go"></button>
    <p class="sheet-hint" data-i18n="sh_hint"></p>
    <button class="btn ghost sheet-close" id="shClose" data-i18n="sh_close"></button>
  </div>
</div>
<div id="toast" hidden></div>

<div id="viewer" hidden>
  <div class="vbar">
    <button id="vOut" aria-label="Zoom out">−</button>
    <button id="vIn" aria-label="Zoom in">+</button>
    <span id="vCount"></span>
    <button id="vClose" aria-label="Close">✕</button>
  </div>
  <div class="vscroll" id="vScroll"><img id="vImg" alt=""></div>
  <button class="vnav prev" id="vPrev" aria-label="Previous">‹</button>
  <button class="vnav next" id="vNext" aria-label="Next">›</button>
</div>

<script src="i18n.js"></script>
<script src="version.js"></script>
<script src="data.js"></script>
<script src="th.js"></script>
<script src="en.js"></script>
<script src="ans.js"></script>
<script src="quarters.js"></script>
<script src="stats.js"></script>
<script src="tts.js"></script>
<script src="gamedata.js"></script>
<script src="game.js"></script>
<script src="exam.js"></script>
<script src="me.js"></script>
<script src="app.js"></script>
<script src="update.js"></script>
</body>
</html>

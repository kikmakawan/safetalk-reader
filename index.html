<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeTalk Q3/2026</title>
<meta name="theme-color" content="#ffd6e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SafeTalk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="updBar" hidden>มีเวอร์ชันใหม่ <b id="updV"></b> <button id="updGo">อัปเดตเลย</button><button id="updX" aria-label="ปิด">✕</button></div>
<header class="top">
  <div class="brand">
    <div>
      <h1>SafeTalk <span class="q">Q3/2026</span><span class="plane">✈️</span></h1>
      <p class="sub">ทบทวน Safety · First Aid · Security <button id="verBtn" class="ver" aria-label="เวอร์ชันและอัปเดต">v<span id="verTxt"></span> ⟳</button></p>
    </div>
    <div class="ring" id="ring" title="ความคืบหน้า">
      <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" class="bg"/><circle cx="18" cy="18" r="15.5" class="fg" id="ringFg"/></svg>
      <b id="ringTxt">0/0</b>
    </div>
  </div>
  <nav class="modes" role="tablist">
    <button data-mode="read" class="on">อ่าน</button>
    <button data-mode="cards">แฟลชการ์ด</button>
    <button data-mode="game">เกม</button>
    <button data-mode="pages">หน้าต้นฉบับ</button>
  </nav>
</header>

<main>
  <section id="filters">
    <div class="search"><input id="q" type="search" placeholder="ค้นหาไทยหรืออังกฤษ เช่น ประตู, ELT, ทารก…" autocomplete="off"></div>
    <div class="chips" id="secChips"></div>
    <div class="chips fleet" id="fleetChips">
      <span class="lbl">✈️ เครื่อง</span>
      <button data-fleet="all" class="on">ทั้งหมด</button>
      <button data-fleet="A">🩷 Airbus</button>
      <button data-fleet="B">💙 Boeing</button>
    </div>
  </section>

  <section id="read"></section>

  <section id="cards" hidden>
    <div class="cardbar">
      <label><input type="checkbox" id="onlyTodo"> เฉพาะข้อที่ยังไม่จำ</label>
      <button id="shuffle" class="ghost">สุ่มลำดับ</button>
    </div>
    <div id="card"></div>
  </section>

  <section id="game" hidden></section>

  <section id="pages" hidden></section>
</main>

<div id="sheet" hidden>
  <div class="sheet-card">
    <h3>SafeTalk Reader</h3>
    <div class="sheet-row"><span>เวอร์ชันที่ใช้อยู่</span><b id="shCur"></b></div>
    <div class="sheet-row"><span>เวอร์ชันล่าสุดบนเซิร์ฟเวอร์</span><b id="shNew">กำลังตรวจสอบ…</b></div>
    <div class="sheet-notes"><b>มีอะไรใหม่</b><ul id="shNotes"></ul></div>
    <button class="btn ok sheet-go" id="shGo">⟳ รีเฟรชโหลดเวอร์ชันล่าสุด</button>
    <p class="sheet-hint">ล้างแคชในเครื่องแล้วโหลดใหม่ทั้งหมด ความคืบหน้าและสถิติเกมยังอยู่ครบ</p>
    <button class="btn ghost sheet-close" id="shClose">ปิด</button>
  </div>
</div>
<div id="toast" hidden></div>

<div id="viewer" hidden>
  <div class="vbar">
    <button id="vOut" aria-label="ซูมออก">−</button>
    <button id="vIn" aria-label="ซูมเข้า">+</button>
    <span id="vCount"></span>
    <button id="vClose" aria-label="ปิด">✕</button>
  </div>
  <div class="vscroll" id="vScroll"><img id="vImg" alt=""></div>
  <button class="vnav prev" id="vPrev" aria-label="ก่อนหน้า">‹</button>
  <button class="vnav next" id="vNext" aria-label="ถัดไป">›</button>
</div>

<script src="version.js"></script>
<script src="data.js"></script>
<script src="th.js"></script>
<script src="gamedata.js"></script>
<script src="game.js"></script>
<script src="app.js"></script>
<script src="update.js"></script>
</body>
</html>
